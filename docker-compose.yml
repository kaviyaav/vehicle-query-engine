services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vqe_user
      POSTGRES_PASSWORD: vqe_pass
      POSTGRES_DB: vqe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vqe_user -d vqe_db"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://vqe_user:vqe_pass@db:5432/vqe_db
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  seed:
    build: .
    command: python scripts/seed.py
    environment:
      DATABASE_URL: postgresql://vqe_user:vqe_pass@db:5432/vqe_db
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vqe_user:vqe_pass@db:5432/vqe_db
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
